<title id="schema-deces-title">Étoile Gold : décès</title>
<desc id="schema-deces-desc">Une table de faits des décès reliée à trois dimensions propres : temps, lieu du décès (commune, département, région) et défunt (sexe, tranche d'âge).</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #schema-gold-deces-root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75;
  --font-sans:'Geist', system-ui, sans-serif; --font-serif:'Instrument Serif','Noto Serif',serif; --font-mono:'Geist Mono', ui-monospace, monospace; }
      #schema-gold-deces-root { font-family: var(--font-sans); color: var(--color-ink); }
      #schema-gold-deces-root .diagram-container { width:100%; overflow-x:auto; }
      #schema-gold-deces-root h2.sec { font-family:var(--font-serif); font-size:1.5rem; font-weight:400; letter-spacing:-.02em; margin:2.5rem 0 .4rem; }
      #schema-gold-deces-root .sub { font-size:14px; color:var(--color-muted); margin-bottom:1.25rem; line-height:1.5; }
      #schema-gold-deces-root text { font-family:var(--font-sans); fill:var(--color-ink); }
      #schema-gold-deces-root .tn { font-size:12px; font-weight:600; }
      #schema-gold-deces-root .cn { font-size:12px; font-weight:500; }
      #schema-gold-deces-root .ct { font-size:10px; font-family:var(--font-mono); }
      #schema-gold-deces-root .eb { font-size:9px; font-weight:500; letter-spacing:.12em; font-family:var(--font-mono); }
      #schema-gold-deces-root table { width:100%; border-collapse:collapse; font-size:13px; background:#fff; border:1px solid rgba(45,49,66,.12); border-radius:6px; }
      #schema-gold-deces-root th { text-align:left; font-family:var(--font-mono); font-size:.66rem; letter-spacing:.14em; text-transform:uppercase; color:var(--color-muted); padding:10px 12px; font-weight:500; }
      #schema-gold-deces-root td { padding:8px 12px; border-top:1px solid rgba(45,49,66,.12); color:var(--color-muted); vertical-align:top; }
      #schema-gold-deces-root td:first-child { color:var(--color-ink); font-weight:500; width:34%; }
      #schema-gold-deces-root .note { font-size:13px; color:var(--color-muted); line-height:1.55; margin-top:1rem; }
      @media print {
#schema-gold-deces-root .diagram-container { overflow-x:visible; }
}</style>
