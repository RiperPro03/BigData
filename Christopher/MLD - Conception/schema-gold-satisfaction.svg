<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1240 284" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="schema-satis-title schema-satis-desc" id="schema-gold-satisfaction-root">
<title id="schema-satis-title">Étoile Gold : satisfaction</title>
<desc id="schema-satis-desc">Une table de faits de satisfaction par établissement et par année, reliée à un calendrier propre (année) et à une dimension établissement propre (finess, raison sociale, région).</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #schema-gold-satisfaction-root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75;
  --font-sans:'Geist', system-ui, sans-serif; --font-serif:'Instrument Serif','Noto Serif',serif; --font-mono:'Geist Mono', ui-monospace, monospace; }
      #schema-gold-satisfaction-root { font-family: var(--font-sans); color: var(--color-ink); }
      #schema-gold-satisfaction-root .diagram-container { width:100%; overflow-x:auto; }
      #schema-gold-satisfaction-root h2.sec { font-family:var(--font-serif); font-size:1.5rem; font-weight:400; letter-spacing:-.02em; margin:2.5rem 0 .4rem; }
      #schema-gold-satisfaction-root .sub { font-size:14px; color:var(--color-muted); margin-bottom:1.25rem; line-height:1.5; }
      #schema-gold-satisfaction-root text { font-family:var(--font-sans); fill:var(--color-ink); }
      #schema-gold-satisfaction-root .tn { font-size:12px; font-weight:600; }
      #schema-gold-satisfaction-root .cn { font-size:12px; font-weight:500; }
      #schema-gold-satisfaction-root .ct { font-size:10px; font-family:var(--font-mono); }
      #schema-gold-satisfaction-root .eb { font-size:9px; font-weight:500; letter-spacing:.12em; font-family:var(--font-mono); }
      #schema-gold-satisfaction-root table { width:100%; border-collapse:collapse; font-size:13px; background:#fff; border:1px solid rgba(45,49,66,.12); border-radius:6px; }
      #schema-gold-satisfaction-root th { text-align:left; font-family:var(--font-mono); font-size:.66rem; letter-spacing:.14em; text-transform:uppercase; color:var(--color-muted); padding:10px 12px; font-weight:500; }
      #schema-gold-satisfaction-root td { padding:8px 12px; border-top:1px solid rgba(45,49,66,.12); color:var(--color-muted); vertical-align:top; }
      #schema-gold-satisfaction-root td:first-child { color:var(--color-ink); font-weight:500; width:34%; }
      #schema-gold-satisfaction-root .note { font-size:13px; color:var(--color-muted); line-height:1.55; margin-top:1rem; }
      @media print {
#schema-gold-satisfaction-root .diagram-container { overflow-x:visible; }
}</style>
