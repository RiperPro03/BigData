<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1076 606" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="medaillon-title medaillon-desc" id="architecture-medaillon-root">
<title id="medaillon-title">Architecture en médaillon Bronze Silver Gold</title>
<desc id="medaillon-desc">Trois couches HDFS, du brut au modèle en étoile, avec l'outil, le format, l'accès et un exemple pour chacune.</desc>
<defs>
      <style>#architecture-medaillon-root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#bf4520;
  --font-sans:'Geist', system-ui, sans-serif; --font-serif:'Instrument Serif','Noto Serif',serif; --font-mono:'Geist Mono', ui-monospace, monospace; }
      #architecture-medaillon-root { font-family: var(--font-sans); color: var(--color-ink); }
      #architecture-medaillon-root .diagram-container { width:100%; overflow-x:auto; }
      #architecture-medaillon-root .sub { font-size:14px; color:var(--color-muted); margin-bottom:1.5rem; }
      #architecture-medaillon-root .diagram-container > svg { width:100%; min-width:1076px; display:block; }
      #architecture-medaillon-root text { font-family:var(--font-sans); fill:var(--color-ink); }
      #architecture-medaillon-root .tt { font-size:16px; font-weight:700; }
      #architecture-medaillon-root .nn { font-size:12px; font-weight:600; }
      #architecture-medaillon-root .sl { font-size:11px; }
      #architecture-medaillon-root .sv { font-size:11px; }
      #architecture-medaillon-root .eb { font-size:9px; font-weight:500; letter-spacing:.18em; }
      #architecture-medaillon-root .al { font-size:10px; letter-spacing:.08em; font-weight:500; }
      #architecture-medaillon-root text.sl, #architecture-medaillon-root text.sv, #architecture-medaillon-root text.eb, #architecture-medaillon-root text.al { font-family:var(--font-mono); }
      #architecture-medaillon-root .m-tt { font-size:16px; font-weight:700; }
      #architecture-medaillon-root .m-nn { font-size:12px; font-weight:600; }
      #architecture-medaillon-root .m-sl, #architecture-medaillon-root .m-sv { font-size:11px; }
      #architecture-medaillon-root .m-eb { font-size:9px; font-weight:500; letter-spacing:.18em; }
      #architecture-medaillon-root .m-al { font-size:10px; letter-spacing:.08em; font-weight:500; }
      #architecture-medaillon-root text.m-sl, #architecture-medaillon-root text.m-sv, #architecture-medaillon-root text.m-eb, #architecture-medaillon-root text.m-al { font-family:var(--font-mono); }
      #architecture-medaillon-root h2.sec { font-family:var(--font-serif); font-size:1.5rem; font-weight:400; letter-spacing:-.02em; margin:2.5rem 0 .4rem; }
      #architecture-medaillon-root h3.sub3 { font-size:15px; font-weight:600; margin:1.75rem 0 .5rem; }
      #architecture-medaillon-root table.spec { width:100%; border-collapse:collapse; font-size:12.5px; background:#fff; border:1px solid rgba(45,49,66,.12); }
      #architecture-medaillon-root table.spec th { text-align:left; font-family:var(--font-mono); font-size:.62rem; letter-spacing:.12em; text-transform:uppercase; color:var(--color-muted); padding:9px 10px; font-weight:500; background:#fafafa; }
      #architecture-medaillon-root table.spec td { padding:8px 10px; border-top:1px solid rgba(45,49,66,.12); color:var(--color-muted); vertical-align:top; line-height:1.5; }
      #architecture-medaillon-root table.spec td:first-child { color:var(--color-ink); font-weight:600; white-space:nowrap; }
      #architecture-medaillon-root table.spec td code { font-family:var(--font-mono); font-size:11.5px; color:var(--color-ink); }
      #architecture-medaillon-root .note { font-size:13px; color:var(--color-muted); line-height:1.55; margin-top:.75rem; }
      #architecture-medaillon-root ul.spec { margin:.25rem 0 0 1.1rem; font-size:13px; line-height:1.6; color:var(--color-muted); }
      #architecture-medaillon-root ul.spec li { margin-bottom:.35rem; }
      #architecture-medaillon-root .card.focal { border-color:var(--color-accent); }
      @media print {
#architecture-medaillon-root .diagram-container { overflow-x:visible; }
      #architecture-medaillon-root .diagram-container > svg { min-width:0; }
}
      #architecture-medaillon-root p.jobcap { font-family:var(--font-mono); font-size:.66rem; letter-spacing:.12em; color:var(--color-muted); margin:1.5rem 0 .4rem; }</style>
