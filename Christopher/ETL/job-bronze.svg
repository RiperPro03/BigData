<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 576" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bronze-title bronze-desc" id="job-bronze-root"><title id="bronze-title">Job Bronze : conception</title><desc id="bronze-desc">Cinq sources (PostgreSQL, CSV santé, satisfaction, décès, codes postaux) sont copiées à l'identique par le job Bronze vers cinq dossiers HDFS.</desc><defs>
      <style>#job-bronze-root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#bf4520;
  --font-sans:'Geist', system-ui, sans-serif; --font-serif:'Instrument Serif','Noto Serif',serif; --font-mono:'Geist Mono', ui-monospace, monospace; }
      #job-bronze-root { font-family: var(--font-sans); color: var(--color-ink); }
      #job-bronze-root .diagram-container { width:100%; overflow-x:auto; }
      #job-bronze-root .sub { font-size:14px; color:var(--color-muted); margin-bottom:1.5rem; }
      #job-bronze-root .diagram-container > svg { width:100%; min-width:1076px; display:block; }
      #job-bronze-root text { font-family:var(--font-sans); fill:var(--color-ink); }
      #job-bronze-root .tt { font-size:16px; font-weight:700; }
      #job-bronze-root .nn { font-size:12px; font-weight:600; }
      #job-bronze-root .sl { font-size:11px; }
      #job-bronze-root .sv { font-size:11px; }
      #job-bronze-root .eb { font-size:9px; font-weight:500; letter-spacing:.18em; }
      #job-bronze-root .al { font-size:10px; letter-spacing:.08em; font-weight:500; }
      #job-bronze-root text.sl, #job-bronze-root text.sv, #job-bronze-root text.eb, #job-bronze-root text.al { font-family:var(--font-mono); }
      #job-bronze-root .m-tt { font-size:16px; font-weight:700; }
      #job-bronze-root .m-nn { font-size:12px; font-weight:600; }
      #job-bronze-root .m-sl, #job-bronze-root .m-sv { font-size:11px; }
      #job-bronze-root .m-eb { font-size:9px; font-weight:500; letter-spacing:.18em; }
      #job-bronze-root .m-al { font-size:10px; letter-spacing:.08em; font-weight:500; }
      #job-bronze-root text.m-sl, #job-bronze-root text.m-sv, #job-bronze-root text.m-eb, #job-bronze-root text.m-al { font-family:var(--font-mono); }
      #job-bronze-root h2.sec { font-family:var(--font-serif); font-size:1.5rem; font-weight:400; letter-spacing:-.02em; margin:2.5rem 0 .4rem; }
      #job-bronze-root h3.sub3 { font-size:15px; font-weight:600; margin:1.75rem 0 .5rem; }
      #job-bronze-root table.spec { width:100%; border-collapse:collapse; font-size:12.5px; background:#fff; border:1px solid rgba(45,49,66,.12); }
      #job-bronze-root table.spec th { text-align:left; font-family:var(--font-mono); font-size:.62rem; letter-spacing:.12em; text-transform:uppercase; color:var(--color-muted); padding:9px 10px; font-weight:500; background:#fafafa; }
      #job-bronze-root table.spec td { padding:8px 10px; border-top:1px solid rgba(45,49,66,.12); color:var(--color-muted); vertical-align:top; line-height:1.5; }
      #job-bronze-root table.spec td:first-child { color:var(--color-ink); font-weight:600; white-space:nowrap; }
      #job-bronze-root table.spec td code { font-family:var(--font-mono); font-size:11.5px; color:var(--color-ink); }
      #job-bronze-root .note { font-size:13px; color:var(--color-muted); line-height:1.55; margin-top:.75rem; }
      #job-bronze-root ul.spec { margin:.25rem 0 0 1.1rem; font-size:13px; line-height:1.6; color:var(--color-muted); }
      #job-bronze-root ul.spec li { margin-bottom:.35rem; }
      #job-bronze-root .card.focal { border-color:var(--color-accent); }
      @media print {
#job-bronze-root .diagram-container { overflow-x:visible; }
      #job-bronze-root .diagram-container > svg { min-width:0; }
}
