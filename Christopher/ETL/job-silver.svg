      #job-silver-root .m-eb { font-size:9px; font-weight:500; letter-spacing:.18em; }
      #job-silver-root .m-al { font-size:10px; letter-spacing:.08em; font-weight:500; }
      #job-silver-root text.m-sl, #job-silver-root text.m-sv, #job-silver-root text.m-eb, #job-silver-root text.m-al { font-family:var(--font-mono); }
      #job-silver-root h2.sec { font-family:var(--font-serif); font-size:1.5rem; font-weight:400; letter-spacing:-.02em; margin:2.5rem 0 .4rem; }
      #job-silver-root h3.sub3 { font-size:15px; font-weight:600; margin:1.75rem 0 .5rem; }
