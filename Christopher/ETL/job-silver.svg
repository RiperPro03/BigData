      #job-silver-root table.spec td { padding:8px 10px; border-top:1px solid rgba(45,49,66,.12); color:var(--color-muted); vertical-align:top; line-height:1.5; }
      #job-silver-root table.spec td:first-child { color:var(--color-ink); font-weight:600; white-space:nowrap; }
      #job-silver-root table.spec td code { font-family:var(--font-mono); font-size:11.5px; color:var(--color-ink); }
      #job-silver-root .note { font-size:13px; color:var(--color-muted); line-height:1.55; margin-top:.75rem; }
      #job-silver-root ul.spec { margin:.25rem 0 0 1.1rem; font-size:13px; line-height:1.6; color:var(--color-muted); }
      #job-silver-root ul.spec li { margin-bottom:.35rem; }
      #job-silver-root .card.focal { border-color:var(--color-accent); }
      @media print {
#job-silver-root .diagram-container { overflow-x:visible; }
      #job-silver-root .diagram-container > svg { min-width:0; }
}
