<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="silver-title silver-desc" id="job-silver-root"><title id="silver-title">Job Silver : conception</title><desc id="silver-desc">Cinq process lisent les dossiers Bronze, corrigent les types, pseudonymisent et dédoublonnent, puis écrivent dans les dossiers Silver ; les lignes invalides vont dans les dossiers de rejets avec leur motif.</desc><defs>
      <style>#job-silver-root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#bf4520;
