      #job-silver-root .al { font-size:10px; letter-spacing:.08em; font-weight:500; }
      #job-silver-root text.sl, #job-silver-root text.sv, #job-silver-root text.eb, #job-silver-root text.al { font-family:var(--font-mono); }
      #job-silver-root .m-tt { font-size:16px; font-weight:700; }
      #job-silver-root .m-nn { font-size:12px; font-weight:600; }
